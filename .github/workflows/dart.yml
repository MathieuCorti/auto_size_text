name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: ${{ matrix.gate }} / Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: compat-minimum
            flutter: 3.41.0
            revision: 44a626f4f0027bc38a46dc68aed5964b05a83c18
          - gate: compat-high
            revision: d3b14c876900e553bc736ca19295fc09e3853e8e
            flutter: 3.47.2
          - gate: downgrade
            flutter: 3.41.0
            revision: 44a626f4f0027bc38a46dc68aed5964b05a83c18
          - gate: demo
            revision: d3b14c876900e553bc736ca19295fc09e3853e8e
            flutter: 3.47.2
          - gate: package
            revision: d3b14c876900e553bc736ca19295fc09e3853e8e
            flutter: 3.47.2
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate local engineering policy
        run: |
          python3 tool/quality_check.py check
          python3 -B tool/test_ci_impact.py

      - name: Determine affected surfaces
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 tool/ci_impact.py --gate "${{ matrix.gate }}"
          --base "$CI_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'demo'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Flutter and pub caches
        if: steps.impact.outputs.enabled == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.tool_cache }}/flutter/${{ matrix.flutter }}
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ matrix.flutter }}-${{ matrix.revision }}-${{ hashFiles('**/pubspec.*') }}

      - name: Install exact Flutter revision
        if: steps.impact.outputs.enabled == 'true'
        env:
          CI_FLUTTER_VERSION: ${{ matrix.flutter }}
          CI_FLUTTER_REVISION: ${{ matrix.revision }}
        run: |
          flutter_root="$RUNNER_TOOL_CACHE/flutter/$CI_FLUTTER_VERSION"
          if [ ! -x "$flutter_root/bin/flutter" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE/flutter"
            git clone --branch "$CI_FLUTTER_VERSION" --depth=1 https://github.com/flutter/flutter.git "$flutter_root"
          fi
          actual_revision="$(git -C "$flutter_root" rev-parse HEAD)"
          if [ "$actual_revision" != "$CI_FLUTTER_REVISION" ]; then
            printf 'Expected Flutter %s, found %s\n' "$CI_FLUTTER_REVISION" "$actual_revision"
            exit 1
          fi
          printf '%s/bin\n' "$flutter_root" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" config --no-analytics
          "$flutter_root/bin/flutter" --version

      - name: Check commit whitespace
        if: >-
          matrix.gate == 'compat-high' &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'))
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "${CI_BASE_SHA}..HEAD"

      - name: Validate package and locked example
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'compat-high'
        run: |
          flutter pub get --no-example
          flutter analyze --no-pub --fatal-infos --fatal-warnings lib test example/main.dart
          flutter test --no-pub
          cd example
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Check formatting
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'compat-high'
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/main.dart

      - name: Validate minimum package and example resolution
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'compat-minimum'
        run: |
          minimum_tree="$RUNNER_TEMP/minimum-tree"
          mkdir "$minimum_tree"
          git archive --format=tar HEAD | tar -xf - -C "$minimum_tree"
          mv "$minimum_tree/example/pubspec.lock" "$minimum_tree/example/pubspec.lock.canonical-high"
          cd "$minimum_tree"
          flutter pub get --no-example
          flutter analyze --no-pub --fatal-infos --fatal-warnings lib test example/main.dart
          flutter test --no-pub
          cd example
          flutter pub get
          flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Validate downgraded dependencies
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'downgrade'
        run: |
          downgrade_tree="$RUNNER_TEMP/downgrade-tree"
          mkdir "$downgrade_tree"
          git archive --format=tar HEAD | tar -xf - -C "$downgrade_tree"
          mv \
            "$downgrade_tree/example/pubspec.lock" \
            "$downgrade_tree/example/pubspec.lock.canonical-high"
          cd "$downgrade_tree"
          flutter pub get --no-example
          flutter pub downgrade --no-example
          flutter analyze \
            --no-pub --fatal-infos --fatal-warnings \
            lib test example/main.dart
          flutter test --no-pub

      - name: Analyze, smoke test, and build demo
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'demo'
        working-directory: demo
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub --fatal-infos --fatal-warnings
          flutter test --no-pub test/demo_smoke_test.dart
          flutter build apk --debug --no-pub

      - name: Check ignored tracked files
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'package'
        run: |
          ignored_files="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored_files" ]; then
            printf '%s\n' "$ignored_files"
            exit 1
          fi

      - name: Validate API documentation
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'package'
        env:
          FLUTTER_ROOT: ${{ runner.tool_cache }}/flutter/${{ matrix.flutter }}
        run: |
          dartdoc_log="$RUNNER_TEMP/dartdoc-dry-run.log"
          flutter pub get --no-example
          dart doc --output "$RUNNER_TEMP/dartdoc" --dry-run \
            2>&1 | tee "$dartdoc_log"
          grep -Fq 'Found 0 warnings and 0 errors.' "$dartdoc_log"

      - name: Validate publish archive
        if: steps.impact.outputs.enabled == 'true' && matrix.gate == 'package'
        run: |
          publish_log="$RUNNER_TEMP/publish-dry-run.log"
          archive_listing="$RUNNER_TEMP/publish-archive-listing.txt"
          flutter pub publish --dry-run --verbose 2>&1 | tee "$publish_log"

          awk -v root="$GITHUB_WORKSPACE/" '
            /Creating \.tar\.gz stream containing:/ {
              listing = 1
              next
            }
            listing && /^MSG :/ {
              exit
            }
            listing && /^    \| / {
              path = substr($0, 7)
              if (index(path, root) == 1) {
                path = substr(path, length(root) + 1)
              }
              if (path != ".") {
                print path
              }
            }
          ' "$publish_log" > "$archive_listing"
          cat "$archive_listing"
          test -s "$archive_listing"
          grep -Fq 'Package has 0 warnings.' "$publish_log"

          for required_path in \
            CHANGELOG.md \
            LICENSE \
            README.md \
            analysis_options.yaml \
            pubspec.yaml \
            example/main.dart \
            example/pubspec.yaml \
            test/assets/fonts/LICENSE-NotoNaskhArabic.txt \
            test/assets/fonts/LICENSE-Roboto.txt \
            test/assets/fonts/auto_size_metric_naskh_locl.ttf \
            test/assets/fonts/auto_size_metric_roboto_bold.ttf \
            test/assets/fonts/auto_size_metric_roboto_regular.ttf
          do
            if ! grep -Fxq "$required_path" "$archive_listing"; then
              printf 'Missing required archive path: %s\n' "$required_path"
              exit 1
            fi
          done
          grep -Eq '^lib/.+' "$archive_listing"
          grep -Eq '^test/.+' "$archive_listing"

          forbidden_pattern='(^|/)(\.agents|\.gtm|\.fvm|\.dart_tool|\.github|\.secrets|android|build|coverage|demo|ios|maintenance|secrets|tool)(/|$)|(^|/)(AGENTS\.md|CLAUDE\.md|\.fvmrc|pubspec\.lock)$|(^|/)(GoogleService-Info\.plist|google-services\.json|gradle-wrapper\.jar|gradlew|gradlew\.bat|key\.properties|keystore\.properties|local\.properties)$|(^|/)(\.env(\..*)?|.*\.(asc|cer|crt|der|jks|key|keystore|mobileprovision|p12|pem|pfx|ppk|provisionprofile|secret|sig))$|^/|^[A-Za-z]:[/\\]'
          if grep -Eq "$forbidden_pattern" "$archive_listing"; then
            printf 'Forbidden archive paths:\n'
            grep -E "$forbidden_pattern" "$archive_listing"
            exit 1
          fi

      - name: Check checkout remains clean
        run: |
          git status --short
          test -z "$(git status --short)"

  quality:
    name: Quality
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful selected work
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
